name: ci

on:
  push:
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pybind11 pybind11-stubgen scikit-build-core cmake

      - name: Build wheel (DEBUG_MODE=1)
        run: python -m build -Ccmake.define.DEBUG_MODE=1

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test-cpp:
    name: test cpp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake

      - name: Configure C++ tests
        run: cmake -S tests -B build/tests

      - name: Build C++ tests
        run: cmake --build build/tests --config Release

      - name: Run C++ tests (Windows)
        if: runner.os == 'Windows'
        run: ./build/tests/Release/fastlz_cpp_tests.exe

      - name: Run C++ tests (Unix)
        if: runner.os != 'Windows'
        run: ./build/tests/fastlz_cpp_tests

  test-python:
    name: test python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Run Python tests
        run: |
          python tests/test_decompression.py
          python tests/test_memory_copy.py
